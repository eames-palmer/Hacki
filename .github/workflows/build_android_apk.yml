name: Build Android APK

on:
  # Allow manual builds of this workflow.
  workflow_dispatch: { }
  push:
    branches:
      - master
    # Only build when any of these directories has been modified.
    paths:
      - lib/**
      - pubspec.lock
      - pubspec.yaml
      - submodules/**
      - android/**
      - .github/workflows/build_android_apk.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Check out from git
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - run: submodules/flutter/bin/flutter doctor
      - run: submodules/flutter/bin/flutter pub get
      - run: submodules/flutter/bin/dart format --set-exit-if-changed lib test integration_test
      - run: submodules/flutter/bin/flutter analyze lib test integration_test
      - run: submodules/flutter/bin/flutter test

      - name: Build debug APK
        run: submodules/flutter/bin/flutter build apk --debug --split-per-abi
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Validate signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: |
          if [ ! -s android/app/keystore.jks ]; then
            echo "The decoded keystore file is empty or missing."
            exit 1
          fi

          if ! keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            > /tmp/keytool-list.txt 2>&1; then
            cat /tmp/keytool-list.txt
            echo "The signing keystore could not be read. Confirm that KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD are valid."
            exit 1
          fi

          cat /tmp/keytool-list.txt

      - name: Create key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          storeType=${{ secrets.KEYSTORE_TYPE }}
          EOF

      - name: Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: submodules/flutter/bin/flutter build apk --release --split-per-abi
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload signed APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Build signed release app bundle
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: submodules/flutter/bin/flutter build appbundle --release

      - name: Upload signed AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
